<!doctype html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <!-- Recommended: local copy of sdpi-components.js -->
  <script src="sdpi-components.js"></script>

  <style>
    /* Ensure the PI itself is transparent-looking */
    html, body {
      background: transparent !important;
  
         
    }
    body {
      margin: 10px;

    }
  

  </style>
</head>

<body>
  <sdpi-item label="Website A">
    <sdpi-textfield setting="urlA" placeholder="https://example.com/on"></sdpi-textfield>
  </sdpi-item>

  <sdpi-item label="Website B">
    <sdpi-textfield setting="urlB" placeholder="https://example.com/off"></sdpi-textfield>
  </sdpi-item>



<div class="normal-text">
<b>Windows:</b> select your browser .exe (e.g. chrome.exe)
    <div><b>macOS:</b> select the browser .app (e.g. Google Chrome.app)</div>
</div>
   



</body>
</html>
